appId: ai.deepseek.harness.desktop
productName: DeepSeek Harness
# asar must stay off: the profile module fallback symlinks installation
# packages into $DSH_HOME/profiles/node_modules, and Node's ESM resolver stats
# those links with the raw syscall, which cannot see inside an asar archive
# (Electron only patches paths that already contain a .asar segment). With
# asar on, every bare-specifier loader entry fails to resolve from the profile
# directory -> "Cannot find package" AggregateError at boot.
asar: false
directories:
  output: release
files:
  - lib/**
  - "!**/*.map"
mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
win:
  artifactName: dsh-desktop-${version}-${arch}-setup.${ext}
  target:
    - target: nsis
      arch:
        - x64
        - arm64
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: DeepSeek Harness
linux:
  executableName: dsh-desktop
  maintainer: DeepSeek Harness
  artifactName: dsh-desktop-${version}-${arch}.${ext}
  category: Development
  target:
    - target: AppImage
      arch:
        - x64
        - arm64
    - target: deb
      arch:
        - x64
        - arm64
deb:
  packageName: dsh-desktop
npmRebuild: true
