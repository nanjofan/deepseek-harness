appId: ai.deepseek.harness.desktop
productName: DeepSeek Harness
asar: true
directories:
  output: release
files:
  - lib/**
  - "!**/*.map"
mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
win:
  target:
    - target: nsis
      arch:
        - x64
        - arm64
linux:
  executableName: dsh-desktop
  maintainer: DeepSeek Harness
  packageName: dsh-desktop
  artifactName: dsh-desktop-${version}-${arch}.${ext}
  category: Development
  target:
    - target: AppImage
      arch:
        - x64
        - arm64
    - target: deb
      arch:
        - x64
        - arm64
npmRebuild: true
